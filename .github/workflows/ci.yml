name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version this project is developed against.
          node-version: '22'
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if the lock
      # is out of sync with package.json. It also runs the `postinstall` hook,
      # which applies patches/react-native+0.81.5.patch via patch-package.
      #
      # Note: several of expo's dependencies (@expo/vector-icons, expo-asset,
      # expo-font) resolve NESTED under node_modules/expo/node_modules rather
      # than hoisted to the root. jest.config.js's moduleNameMapper and
      # tsconfig.json's compilerOptions.paths both depend on that layout.
      # `npm ci` reproduces it faithfully — verified against a clean clone.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs both tiers: `test:lib` (bare node:assert scripts in src/lib, via
      # tsx) then `test:components` (jest-expo + @testing-library/react-native).
      - name: Test
        run: npm test
